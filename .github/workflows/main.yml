name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🔑 This step CREATES the .next directory
      - name: Build Next.js app
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo ".next directory missing – build failed"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint
